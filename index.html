<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08131F">
<title>Fingerball</title>
<style>
  :root{
    --bg:#08131F; --panel:#10243A; --line:#1D3F5C;
    --text:#EAF3FA; --dim:#7E9BB4;
    --amber:#FFC53D; --mint:#3BE0A0; --red:#FF6B5E;
    --font:"Trebuchet MS","Lucida Grande",Verdana,system-ui,sans-serif;
    --pad:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:var(--font);overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0}
  canvas{position:absolute;display:block;touch-action:none}

  /* ---------- üstüne binen arayüz ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;
    padding:calc(var(--pad) + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right))
            calc(var(--pad) + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
    transition:opacity .15s}
  #hud.dim{opacity:0}
  #hud button{pointer-events:auto}
  .hudTop{position:absolute;top:calc(var(--pad) + env(safe-area-inset-top));
    left:calc(var(--pad) + env(safe-area-inset-left));right:calc(var(--pad) + env(safe-area-inset-right));
    display:flex;align-items:center;gap:12px}
  .chip{background:rgba(8,19,31,.72);border:1px solid var(--line);border-radius:14px;
    padding:7px 12px;display:flex;align-items:center;gap:9px;backdrop-filter:blur(6px)}
  #lvlNum{font-size:12px;color:var(--dim)}
  #lvlName{font-size:14px;font-weight:bold}
  .inkbar{width:min(30vw,240px);height:9px;border-radius:5px;background:#0C1D2E;
    border:1px solid var(--line);overflow:hidden}
  .inkfill{height:100%;width:100%;background:var(--amber);transition:width .1s linear}
  .inkfill.low{background:var(--red)}
  #stars{font-size:15px;letter-spacing:2px;color:#2E4C66}
  #stars b{color:var(--amber);font-weight:normal}
  #rings{font-size:12px;color:var(--dim);letter-spacing:0}
  #rings b{color:#FFB020;font-weight:bold}
  .clock{font-size:16px;font-weight:bold;min-width:46px;text-align:center}
  .clock.warn{color:var(--red)}
  .spacer{flex:1}

  .hudBR{position:absolute;bottom:calc(var(--pad) + env(safe-area-inset-bottom));
    right:calc(var(--pad) + env(safe-area-inset-right))}
  button{font-family:var(--font);border:none;cursor:pointer;color:var(--text);font-size:15px}
  .tool{width:56px;height:56px;border-radius:18px;background:rgba(16,36,58,.85);
    border:1px solid var(--line);font-size:22px;display:grid;place-items:center;backdrop-filter:blur(6px)}
  .tool.on{background:var(--amber);color:#26200A;border-color:var(--amber)}
  .tool:disabled{opacity:.3}
  .tool.small{width:44px;height:44px;font-size:17px;border-radius:14px}
  .kick{width:110px;height:76px;border-radius:24px;background:var(--mint);color:#05271B;
    font-weight:bold;font-size:22px;letter-spacing:1.5px;
    box-shadow:0 6px 22px rgba(59,224,160,.28)}
  .kick.stop{background:rgba(16,36,58,.9);color:var(--text);border:1px solid var(--line);
    font-size:26px;box-shadow:none}
  .kick.charging{background:var(--amber);color:#26200A;transform:scale(.96);
    box-shadow:0 0 0 4px rgba(255,197,61,.25)}

  /* ---------- paneller ---------- */
  .veil{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;
    background:rgba(6,15,26,.9);backdrop-filter:blur(5px)}
  .veil.hide{display:none}
  .scroll{width:100%;max-height:100%;overflow-y:auto;display:grid;place-items:center;padding:8px 0}
  .panel{width:100%;max-width:520px;text-align:center}
  .brand{font-size:clamp(34px,7vw,54px);font-weight:bold;letter-spacing:-1px;margin:0 0 6px;
    background:linear-gradient(180deg,#fff,var(--amber));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .panel h2{font-size:clamp(19px,4vw,25px);margin:0 0 10px}
  .panel p{color:var(--dim);font-size:14px;line-height:1.5;margin:0 0 18px}
  .big{width:100%;height:54px;border-radius:17px;background:var(--mint);color:#05271B;
    font-weight:bold;font-size:17px;margin-bottom:10px}
  .ghost{width:100%;height:48px;border-radius:17px;background:transparent;
    border:1px solid var(--line);margin-bottom:10px}
  .row{display:flex;gap:10px}
  .row>button{margin-bottom:0}
  .earned{font-size:34px;letter-spacing:7px;color:#2E4C66;margin:2px 0 16px}
  .earned b{color:var(--amber);font-weight:normal}
  .hint{background:var(--panel);border-left:3px solid var(--amber);padding:12px 14px;
    border-radius:0 12px 12px 0;font-size:14px;line-height:1.5;text-align:left;margin-bottom:18px}
  .why{color:var(--red);font-size:14px;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:10px 0 18px}
  .grid.balls{grid-template-columns:repeat(4,1fr);gap:14px;max-width:380px;margin:14px auto 20px}
  .chapter{grid-column:1/-1;text-align:left;font-size:12px;letter-spacing:2px;
    color:var(--dim);text-transform:uppercase;margin:10px 0 2px}
  .cell{aspect-ratio:1;border-radius:13px;background:var(--panel);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:15px;font-weight:bold;padding:0}
  .cell .s{font-size:8px;letter-spacing:1px;color:#2E4C66;font-weight:normal}
  .cell .s b{color:var(--amber);font-weight:normal}
  .cell.done{border-color:var(--mint)}
  .cell.locked{opacity:.28}
  .cell.ball img{width:74%;height:74%;object-fit:contain}
  @media (max-width:760px){ .grid{grid-template-columns:repeat(8,1fr)} }

  #rotate{position:absolute;inset:0;z-index:9;display:grid;place-items:center;
    background:var(--bg);text-align:center;padding:30px;font-size:17px;line-height:1.6}
  #rotate.hide{display:none}
  #rotate span{font-size:46px;display:block;margin-bottom:14px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hudTop">
      <button class="tool small" id="btnPause" title="Bölümler">☰</button>
      <div class="chip"><div><div id="lvlNum">1/90</div><div id="lvlName">Açılış</div></div></div>
      <div class="chip"><div class="inkbar"><div class="inkfill" id="inkFill"></div></div></div>
      <div class="spacer"></div>
      <div class="chip"><span id="stars">☆☆</span><span id="rings"></span><span class="clock" id="clock"></span></div>
    </div>
    <div class="hudBR">
      <button class="kick" id="tKick">VUR</button>
      <div style="pointer-events:none;text-align:center;font-size:11px;color:var(--dim);margin-top:6px">basılı tut</div>
    </div>
  </div>

  <div class="veil" id="vMenu"><div class="panel">
    <h1 class="brand">FINGERBALL</h1>
    <p>Parmağınla sahaya çizgi çiz. Vur, topu kaleye gönder.<br>90 bölüm, dokuz perde.</p>
    <button class="big" id="btnPlay">Oyna</button>
    <div class="row">
      <button class="ghost" id="btnLevels">Bölümler</button>
      <button class="ghost" id="btnBalls">Toplar</button>
    </div>
  </div></div>

  <div class="veil hide" id="vLevels"><div class="scroll"><div class="panel">
    <h2>Bölümler</h2>
    <div class="grid" id="grid"></div>
    <button class="ghost" id="btnBack">Geri</button>
  </div></div></div>

  <div class="veil hide" id="vBalls"><div class="scroll"><div class="panel">
    <h2>Top seç</h2>
    <div class="grid balls" id="ballGrid"></div>
    <button class="ghost" id="btnBack2">Geri</button>
  </div></div></div>

  <div class="veil hide" id="vBrief"><div class="panel">
    <h2 id="briefTitle">1. Açılış</h2>
    <div class="hint" id="briefHint"></div>
    <button class="big" id="btnStart">Sahaya çık</button>
  </div></div>

  <div class="veil hide" id="vWin"><div class="panel">
    <h2>GOL!</h2>
    <div class="earned" id="winStars"></div>
    <button class="big" id="btnNext">Sonraki bölüm</button>
    <div class="row">
      <button class="ghost" id="btnReplay">Tekrar</button>
      <button class="ghost" id="btnMenu2">Bölümler</button>
    </div>
  </div></div>

  <div class="veil hide" id="vLose"><div class="panel">
    <h2>Olmadı</h2>
    <p class="why" id="loseWhy"></p>
    <button class="big" id="btnRetry">Tekrar dene</button>
    <button class="ghost" id="btnMenu3">Bölümler</button>
  </div></div>

  <div id="rotate" class="hide"><div><span>📱↻</span>Fingerball yatay oynanır.<br>Telefonu yan çevir.</div></div>
</div>

/* ---------------------------------------------------------------------
   HARF DUVARLARI
   5 sütun x 7 satırlık ızgara. word('BJK', x, y, c) çağrısı, sol üst
   köşesi (x,y) olan ve hücre boyu c olan taş harfleri üretir.
   Yatay komşu hücreler tek dikdörtgende birleştirilir, gövde sayısı düşük kalır.
   Harf genişliği 5c, harfler arası 1c boşluk -> n harf = (6n-1)*c genişlik,
   yükseklik her zaman 7c.
   --------------------------------------------------------------------- */
const FONT = {
  G:['.###.','#....','#....','#.##.','#..#.','#..#.','.###.'],
  S:['.####','#....','#....','.###.','....#','....#','####.'],
  B:['####.','#...#','#...#','####.','#...#','#...#','####.'],
  J:['..###','....#','....#','....#','#...#','#...#','.###.'],
  K:['#...#','#..#.','#.#..','##...','#.#..','#..#.','#...#'],
  F:['#####','#....','#....','####.','#....','#....','#....'],
  T:['#####','..#..','..#..','..#..','..#..','..#..','..#..'],
  A:['.###.','#...#','#...#','#####','#...#','#...#','#...#']
};
const wordW = (text,c)=> (6*text.length-1)*c;
const wordH = c=> 7*c;
function word(text, x, y, c){
  const out = [];
  let ox = x;
  for (const ch of text){
    const g = FONT[ch];
    if (!g){ ox += 6*c; continue; }
    for (let r=0; r<7; r++){
      let run = 0;
      for (let col=0; col<=5; col++){
        const on = col < 5 && g[r][col] === '#';
        if (on){ run++; continue; }
        if (run){
          out.push({ t:'pillar', x: ox + (col-run)*c + run*c/2,
                     y: y + r*c + c/2, w: run*c, h: c });
          run = 0;
        }
      }
    }
    ox += 6*c;
  }
  return out;
}

<script>/* =====================================================================
   FINGERBALL — motor, çizim, arayüz
   ===================================================================== */
const { Engine, Composite, Bodies, Body, Events } = Matter;

const BALL_SKINS = ['ball','ball2','ball3','ball4','ball5','ball6','ball7','ball8'];
const IMG = {};
function loadImages(){
  for (const k of Object.keys(ASSETS)){ const im = new Image(); im.src = ASSETS[k]; IMG[k] = im; }
}

/* ---------- sahne: tam ekran, mektup kutusu ölçekleme ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
let scale = 1;

function resize(){
  const r = stage.getBoundingClientRect();
  scale = Math.min(r.width/CFG.W, r.height/CFG.H);
  const w = CFG.W*scale, h = CFG.H*scale;
  cv.style.width = w+'px';  cv.style.height = h+'px';
  cv.style.left = ((r.width-w)/2)+'px';
  cv.style.top  = ((r.height-h)/2)+'px';
  cv.width  = Math.round(w*dpr);
  cv.height = Math.round(h*dpr);
  document.getElementById('rotate').classList.toggle('hide', r.width >= r.height);
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize,200));

/* ---------- durum ---------- */
let engine, world, ball;
let sensors = [], dynamics = [], strokes = [], bumpers = [];
let level, levelIdx = 0;
let inkLeft = 0;
let phase = 'aim';                     // aim | windup | live | over
let drawing = null, stopTimer = 0, timeLeft = 0, tick = 0;
let trail = [], portalCool = 0, shake = 0, kickT = 0, sparks = [];
let slowmo = 1, banner = null;
let charging = false, chargeT = 0, kickPower = 0, maxAdv = 0;
let stuckAt = null, stuckT = 0, liveT = 0;
const CHARGE = { ms:1300, min:0.50, max:1.25 };   // vuruş gücü, bölüm gücünün katı olarak
const chargeFrac = ()=> Math.min(1, chargeT/CHARGE.ms);
const powerMult  = ()=> CHARGE.min + (CHARGE.max-CHARGE.min)*chargeFrac();
const refFrac    = ()=> (1-CHARGE.min)/(CHARGE.max-CHARGE.min);   // "önerilen" işareti
let skin = 'ball2';
const progress = LEVELS.map(()=>({ done:false, stars:0 }));
// Geliştirme sırasında bütün bölümler açık. Yayın sürümünde false yap.
const DEV_UNLOCK = true;

// Kalıcı kayıt: tarayıcı sürümünde bellekte. Android'de localStorage'a bağla.
const SAVE = { read(){ return null; }, write(){} };

/* ---------- bölüm inşası ---------- */
function makeEngine(){
  engine = Engine.create();
  engine.gravity.y = CFG.GRAV;
  engine.positionIterations = 8;
  engine.velocityIterations = 8;
  world = engine.world;
  Events.on(engine, 'collisionStart', onHit);
}
const ballStart = ()=>({ x: level.player.x + 62*level.dir, y: level.player.y - CFG.BALL_R - 2 });

function buildLevel(idx){
  levelIdx = idx;
  level = LEVELS[idx];

  if (engine){ Events.off(engine,'collisionStart',onHit); Engine.clear(engine); }
  makeEngine();
  sensors = []; dynamics = []; strokes = []; bumpers = []; trail = []; sparks = [];
  stopTimer = 0; portalCool = 0; shake = 0; kickT = 0; tick = 0;
  slowmo = 1; banner = null;
  charging = false; chargeT = 0;
  kickPower = level.kick.p;
  timeLeft = level.time || 0;
  inkLeft = level.ink;
  phase = 'aim'; drawing = null;

  const w = Object.assign({ isStatic:true }, CFG.SURF.wall);
  Composite.add(world, [
    Bodies.rectangle(-60, CFG.H/2, 120, CFG.H*4, w),
    Bodies.rectangle(CFG.W+60, CFG.H/2, 120, CFG.H*4, w),
    Bodies.rectangle(CFG.W/2, -700, CFG.W*3, 120, w)
  ]);
  for (const d of level.bodies) addBody(d);
  addGoal(level.goal);
  (level.stars||[]).forEach(s=> sensors.push({ t:'star', x:s.x, y:s.y, got:false }));

  const bs = ballStart();
  // DİKKAT: topu isStatic:true ile OLUŞTURMA. Matter o durumda _original kaydını
  // tutmaz, sonradan setStatic(false) dediğinde kütle Infinity kalır ve konum NaN olur.
  // Önce dinamik kur, sonra dondur.
  ball = Bodies.circle(bs.x, bs.y, CFG.BALL_R, Object.assign({ label:'ball' }, CFG.BALL));
  Composite.add(world, ball);
  Body.setStatic(ball, true);

  syncHud();
}

function addBody(d){
  const k = d.t;
  if (k==='spike' || k==='fan' || k==='portal'){ sensors.push({...d}); return; }
  if (k==='ring'){ sensors.push({...d, passed:false}); return; }
  let b;
  if (k === 'bumper') b = Bodies.circle(d.x, d.y, d.r, Object.assign({isStatic:true}, CFG.SURF.bump));
  else if (k === 'crate') b = Bodies.rectangle(d.x, d.y, d.w, d.h, Object.assign({}, CFG.SURF.crate));
  else b = Bodies.rectangle(d.x, d.y, d.w, d.h,
    Object.assign({isStatic:true, angle:d.a||0}, CFG.SURF[k] || CFG.SURF.wall));
  b.plugin = { kind:k, def:d, home:{x:d.x, y:d.y} };
  if (k === 'bumper') bumpers.push({ x:d.x, y:d.y, r:d.r, cool:0 });
  // Çamurun yavaşlatma bölgesi: top çamurun ÜSTÜNDE yuvarlandığı için
  // bölgeyi yukarı doğru topun çapı kadar genişletiyoruz.
  if (k === 'mud') sensors.push({ t:'mudzone', x:d.x, y:d.y-34, w:d.w, h:d.h+68 });
  if (k==='mover' || k==='foe' || k==='glass' || k==='crate') dynamics.push(b);
  Composite.add(world, b);
}

// Kale: ön üst direk + arka çapraz direk katı; ağın yamuk içi gol bölgesi
function addGoal(g){
  const dir = g.side === 'R' ? 1 : -1;
  const barY = g.y - GOAL_H*0.93;
  const front = Bodies.rectangle(g.x + dir*GOAL_W*0.26, barY, GOAL_W*0.54, 14,
    Object.assign({isStatic:true}, CFG.SURF.post));
  const ax = g.x + dir*GOAL_W*0.52, bx = g.x + dir*GOAL_W*0.99, by = g.y - GOAL_H*0.04;
  const back = Bodies.rectangle((ax+bx)/2, (barY+by)/2, Math.hypot(bx-ax, by-barY), 14,
    Object.assign({isStatic:true, angle:Math.atan2(by-barY, bx-ax)}, CFG.SURF.post));
  front.plugin = { kind:'crossbar' }; back.plugin = { kind:'crossbar' };
  Composite.add(world, [front, back]);
  sensors.push({ t:'goal', dir, gx:g.x, gy:g.y, barY });
}

function inGoal(){
  const s = sensors.find(x=>x.t==='goal'), p = ball.position;
  if (!isFinite(p.x) || !isFinite(p.y)) return false;   // NaN her testi geçer, gol sanılır
  const rel = (p.x - s.gx)*s.dir;
  if (rel < 8 || rel > GOAL_W*0.95) return false;
  if (p.y > s.gy - 8 || p.y < s.barY + 10) return false;
  const t = (rel - GOAL_W*0.52)/(GOAL_W*0.47);
  if (t > 0){
    const roof = s.barY + t*((s.gy - GOAL_H*0.04) - s.barY);
    if (p.y < roof + 14) return false;
  }
  return true;
}

/* ---------- çizim girdisi ---------- */
const canDraw = ()=> phase === 'aim' && !charging;   // tek şut: sadece vuruştan önce
const pathLen = p=>{ let L=0; for(let i=1;i<p.length;i++) L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y); return L; };

function commitStroke(points){
  if (points.length < 2) return;
  const len = pathLen(points), bodies = [];
  for (let i=1;i<points.length;i++){
    const A=points[i-1], B=points[i];
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy);
    if (L < 1) continue;
    const seg = Bodies.rectangle((A.x+B.x)/2,(A.y+B.y)/2, L+CFG.STROKE_T, CFG.STROKE_T,
      Object.assign({ isStatic:true, angle:Math.atan2(dy,dx) }, CFG.STROKE));
    seg.plugin = { kind:'stroke' };
    bodies.push(seg);
  }
  if (!bodies.length) return;
  Composite.add(world, bodies);
  strokes.push({ points, bodies, len });
  inkLeft -= len;
}

const toWorld = e=>{
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale };
};

cv.addEventListener('pointerdown', e=>{
  if (!canDraw()) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  const p = toWorld(e);
  if (inkLeft <= 10) return;
  drawing = { points:[p], used:0 };
});
cv.addEventListener('pointermove', e=>{
  if (!drawing || !canDraw()) return;
  e.preventDefault();
  const p = toWorld(e), last = drawing.points[drawing.points.length-1];
  const d = Math.hypot(p.x-last.x, p.y-last.y);
  if (d < CFG.STROKE_STEP) return;
  if (drawing.used + d > inkLeft){ endDraw(); return; }
  drawing.points.push(p); drawing.used += d; syncHud();
});
function endDraw(){
  if (!drawing) return;
  const pts = drawing.points; drawing = null;
  commitStroke(pts); syncHud();
}
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,endDraw));

/* ---------- vuruş ve simülasyon ---------- */
// VUR tuşu basılı tutulur: gücü oyuncu belirler. Bırakınca vuruş yapılır.

function releaseBall(){
  const k = level.kick, a = k.a*Math.PI/180, d = level.dir;
  const p = kickPower || k.p;
  Body.setStatic(ball, false);
  if (!isFinite(ball.mass) || ball.inverseMass === 0){   // güvenlik ağı
    Body.setMass(ball, CFG.BALL.density * Math.PI * CFG.BALL_R * CFG.BALL_R);
    Body.setInertia(ball, ball.mass * CFG.BALL_R * CFG.BALL_R * 0.5);
  }
  Body.setVelocity(ball, { x:p*Math.cos(a)*d, y:-p*Math.sin(a) });
  Body.setAngularVelocity(ball, 0.2*d);
  phase = 'live'; stopTimer = 0; trail = []; maxAdv = 0;
  stuckAt = null; stuckT = 0; liveT = 0;
  puff(ball.position.x, ball.position.y, 12);
  syncHud();
}

function onHit(ev){
  for (const pair of ev.pairs){
    const o = pair.bodyA===ball ? pair.bodyB : (pair.bodyB===ball ? pair.bodyA : null);
    if (!o || !o.plugin) continue;
    const sp = Math.hypot(ball.velocity.x, ball.velocity.y);
    if (o.plugin.kind === 'glass' && sp > (o.plugin.def.hard || CFG.GLASS_BREAK)){
      Composite.remove(world, o);
      dynamics = dynamics.filter(b=>b!==o);
      shake = 13; puff(o.position.x, o.position.y, 26, '#BEEBF7');
    }
    if (o.plugin.kind === 'crossbar' && sp > 4 && phase === 'live'){
      shake = 9; flash('DİREK!', '#FFC53D', 800);
    }
  }
}

function puff(x,y,n,c){
  for(let i=0;i<n;i++) sparks.push({ x, y, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
    life:1, c:c||'#FFD98A' });
}
const flash = (text,color,ms)=>{ banner = { text, color, t:0, ms }; };

const rectHitsBall = r=>{
  const cx = Math.max(r.x-r.w/2, Math.min(ball.position.x, r.x+r.w/2));
  const cy = Math.max(r.y-r.h/2, Math.min(ball.position.y, r.y+r.h/2));
  return Math.hypot(ball.position.x-cx, ball.position.y-cy) < CFG.BALL_R;
};
const ballInRect = r=> Math.abs(ball.position.x-r.x)<r.w/2 && Math.abs(ball.position.y-r.y)<r.h/2;

function step(dt){
  tick += dt;
  if (shake > 0.4) shake *= 0.86; else shake = 0;
  if (banner){ banner.t += dt; if (banner.t > banner.ms) banner = null; }

  for (let i=sparks.length-1;i>=0;i--){
    const s = sparks[i];
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.14; s.life-=dt/560;
    if (s.life<=0) sparks.splice(i,1);
  }
  for (const b of dynamics){
    const kk = b.plugin.kind;
    if (kk === 'mover' || kk === 'foe'){
      const d=b.plugin.def, h=b.plugin.home;
      const w = Math.sin(tick/(d.period*1000)*Math.PI*2 + (d.phase||0));
      // hop: zıplama. Yerden yukarı çıkar, altında geçit açılır.
      const ny = d.hop ? h.y - d.hop*Math.abs(w) : h.y + (d.dy||0)*w;
      Body.setPosition(b, { x:h.x+(d.dx||0)*w, y:ny });
      b.plugin.face = (d.dx||0) !== 0 ? (Math.cos(tick/(d.period*1000)*Math.PI*2 + (d.phase||0)) >= 0 ? 1 : -1) : 0;
    }
  }

  if (charging && phase === 'aim') chargeT += dt;

  if (phase === 'windup'){
    kickT += dt;
    if (kickT >= 190 && ball.isStatic) releaseBall();
    Engine.update(engine, dt); return;
  }
  if (phase !== 'live'){ Engine.update(engine, dt); return; }
  kickT += dt;

  if (portalCool > 0) portalCool -= dt;
  for (const s of sensors){
    if (s.t==='spike'){
      if (rectHitsBall(s)){
        Body.setVelocity(ball, {x:0, y:0});      // top dikene saplanıp kalsın
        Body.setAngularVelocity(ball, 0);
        Body.setStatic(ball, true);
        puff(ball.position.x, ball.position.y, 14, '#FF6B5E');
        shake = 10;
        return fail('Dikene çarptı.');
      }
    }
    else if (s.t==='fan'){
      if (ballInRect(s) || rectHitsBall(s)) Body.applyForce(ball, ball.position, {x:s.fx||0, y:s.fy||0});
    }
    else if (s.t==='portal'){
      if (portalCool<=0 && Math.hypot(ball.position.x-s.x, ball.position.y-s.y) < s.r){
        puff(ball.position.x, ball.position.y, 16, '#C77BFF');
        Body.setPosition(ball, { x:s.tx, y:s.ty });
        portalCool = 500; trail = []; shake = 8; maxAdv = 0;
        puff(s.tx, s.ty, 16, '#7BE7FF');
      }
    }
    else if (s.t==='ring'){
      const dx = ball.position.x - s.x, dy = ball.position.y - s.y;
      const dist = Math.hypot(dx, dy);
      // alev halkasına değdi mi: sadece geçidin dışında kalan yaylar yakar
      if (Math.abs(dist - s.r) < 26 && Math.abs(dy) > s.gap){
        Body.setVelocity(ball, {x:0, y:0});        // top aleve yapışıp kalsın
        Body.setAngularVelocity(ball, 0);
        Body.setStatic(ball, true);
        puff(ball.position.x, ball.position.y, 18, '#FF9020');
        shake = 11;
        return fail('Alev çemberine değdi.');
      }
      if (!s.passed && Math.abs(dx) < 24 && Math.abs(dy) < s.gap){
        s.passed = true;
        puff(s.x, s.y, 20, '#FFD34E'); shake = 6;
        flash(ringsLeft() ? 'ÇEMBER GEÇİLDİ' : 'SON ÇEMBER!', '#FFC53D', 900);
        syncHud();
      }
    }
    else if (s.t==='mudzone'){
      if (ballInRect(s) || rectHitsBall(s)){
        const k = CFG.MUD_DAMP;
        Body.setVelocity(ball, { x:ball.velocity.x*k, y:ball.velocity.y*k });
        Body.setAngularVelocity(ball, ball.angularVelocity*k);
        if (Math.random() < 0.25) puff(ball.position.x, ball.position.y+18, 1, '#6D5024');
      }
    }
    else if (s.t==='star'){
      if (!s.got && Math.hypot(ball.position.x-s.x, ball.position.y-s.y) < CFG.STAR_R){
        s.got = true; puff(s.x, s.y, 16, '#FFC53D'); syncHud();
      }
    }
  }
  if (!isFinite(ball.position.x) || !isFinite(ball.position.y)){
    console.error('Fizik hatası: topun konumu sayı değil.');
    return fail('Fizik hatası, bölümü yeniden başlat.');
  }
  // Tampon: yaklaşan topu merkez doğrultusunda, kazançla geri fırlatır
  for (const bp of bumpers){
    if (bp.cool > 0){ bp.cool -= dt; continue; }
    let nx = ball.position.x - bp.x, ny = ball.position.y - bp.y;
    const L = Math.hypot(nx, ny) || 1;
    if (L > bp.r + CFG.BALL_R + 4) continue;
    nx /= L; ny /= L;
    if (ball.velocity.x*nx + ball.velocity.y*ny >= 0) continue;   // uzaklaşıyorsa dokunma
    const inSp = Math.hypot(ball.velocity.x, ball.velocity.y);
    const out = Math.max(inSp * CFG.BUMP_GAIN, CFG.BUMP_MIN);
    Body.setPosition(ball, { x:bp.x + nx*(bp.r+CFG.BALL_R+1), y:bp.y + ny*(bp.r+CFG.BALL_R+1) });
    Body.setVelocity(ball, { x:nx*out, y:ny*out });
    bp.cool = 180;
    shake = 9; puff(ball.position.x, ball.position.y, 16, '#3BE0A0');
  }

  if (inGoal()){
    if (ringsLeft() > 0) return fail('Önce alev çemberlerinden geçmeliydin.');
    return win();
  }

  Engine.update(engine, dt);

  trail.push({ x:ball.position.x, y:ball.position.y });
  if (trail.length > 64) trail.shift();

  if (ball.position.y > CFG.OUT_Y || ball.position.x < -180 || ball.position.x > CFG.W+180)
    return fail('Top sahayı terk etti.');

  // Bitiş belli olduğunda topun yolunu geri katetmesini bekleme.
  // İki işaret: ya vurucunun arkasına düştü, ya da en ileri noktasından
  // epeyce geri kaydı ve hâlâ geriye gidiyor.
  const adv = (ball.position.x - level.player.x) * level.dir;
  if (adv > maxAdv) maxAdv = adv;
  if (adv < -90) return fail('Top geri döndü.');
  // zig: labirent gibi geri gitmenin çözümün parçası olduğu bölümlerde kural kapalı
  if (!level.zig && maxAdv > 220 && adv < maxAdv - CFG.RETREAT &&
      ball.velocity.x * level.dir < -0.5)
    return fail('Top geri kaçtı.');

  const sp = Math.hypot(ball.velocity.x, ball.velocity.y);
  stopTimer = sp < CFG.STOP_SPEED ? stopTimer + dt/1000 : 0;
  if (stopTimer > CFG.STOP_TIME) return fail('Top durdu, kaleye ulaşamadı.');

  // Sıkışma: hız eşiği yetmiyor, çünkü rakip ya da engel topu sürekli
  // titretince hız sıfırlanıyor. Konuma bak: küçük bir daireden çıkamıyorsa sıkışmıştır.
  if (!stuckAt || Math.hypot(ball.position.x-stuckAt.x, ball.position.y-stuckAt.y) > CFG.STUCK_R){
    stuckAt = { x:ball.position.x, y:ball.position.y }; stuckT = 0;
  } else {
    stuckT += dt/1000;
    if (stuckT > CFG.STUCK_TIME) return fail('Top sıkıştı.');
  }
  liveT += dt/1000;
  if (liveT > CFG.MAX_LIVE) return fail('Şut çok uzun sürdü.');

  if (level.time){
    timeLeft -= dt/1000;
    if (timeLeft <= 0) return fail('Süre doldu.');
    syncClock();
  }
}

const starCount = ()=> sensors.filter(s=>s.t==='star'&&s.got).length;
const ringsLeft = ()=> sensors.filter(s=>s.t==='ring'&&!s.passed).length;

function win(){
  phase = 'over'; slowmo = 0.25;
  const got = starCount(), p = progress[levelIdx];
  p.done = true; p.stars = Math.max(p.stars, got);
  shake = 16; flash('GOL!', '#3BE0A0', 2600);
  for (let i=0;i<5;i++) setTimeout(()=>puff(ball.position.x, ball.position.y, 18, '#3BE0A0'), i*110);
  setTimeout(()=>{ slowmo = 1; }, 1100);
  $('winStars').innerHTML = starRow(got, (level.stars||[]).length);
  $('btnNext').style.display = levelIdx < LEVELS.length-1 ? '' : 'none';
  setTimeout(()=>show('vWin'), 1900);
}
function fail(why){
  phase = 'over'; slowmo = 1;
  flash(why, '#FF6B5E', 2600);   // gol yazısıyla aynı süre
  $('loseWhy').textContent = why;
  setTimeout(()=>show('vLose'), 1900);
}
function starRow(got,total){
  if (!total) return '<b>★</b>';
  let o=''; for(let i=0;i<total;i++) o += i<got ? '<b>★</b>' : '☆';
  return o;
}

/* ---------- render ---------- */
function drawFrame(){
  const g = ctx;
  g.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if (shake) g.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  g.clearRect(-80,-80,CFG.W+160,CFG.H+160);
  scene(g);
  for (const s of sensors) if (s.t==='fan') drawFan(g,s);
  drawGoal(g, level.goal);
  for (const b of Composite.allBodies(world)){
    const k = b.plugin && b.plugin.kind;
    if (!k || k==='stroke' || k==='crossbar' || b===ball) continue;
    drawBody(g,b,k);
  }
  for (const s of sensors){
    if (s.t==='spike') drawSpike(g,s);
    else if (s.t==='portal') drawPortal(g,s);
    else if (s.t==='ring') drawRing(g,s);
    else if (s.t==='star' && !s.got) drawStar(g,s);
  }
  for (const s of strokes) drawStroke(g, s.points, 1);
  if (drawing) drawStroke(g, drawing.points, .8);
  drawTrail(g);
  drawPlayer(g);
  drawBall(g);
  drawSparks(g);
  if (charging || phase === 'windup') drawPower(g);
  if (banner) drawBanner(g);
}

function scene(g){
  const sky = g.createLinearGradient(0,0,0,CFG.H);
  sky.addColorStop(0,'#0A1B33'); sky.addColorStop(.55,'#14375C'); sky.addColorStop(1,'#1B5540');
  g.fillStyle = sky; g.fillRect(0,0,CFG.W,CFG.H);
  for (const fx of [220, 800, 1380]){
    const gl = g.createRadialGradient(fx,50,10,fx,50,420);
    gl.addColorStop(0,'rgba(255,250,220,.18)'); gl.addColorStop(1,'rgba(255,250,220,0)');
    g.fillStyle = gl; g.beginPath(); g.arc(fx,50,420,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(8,20,34,.9)'; g.fillRect(fx-4,50,8,110);
    g.fillStyle='#F2E9C8'; rr(g,fx-36,26,72,26,6); g.fill();
  }
  g.fillStyle = 'rgba(6,16,30,.72)';
  g.beginPath(); g.moveTo(0,300);
  for (let x=0;x<=CFG.W;x+=54){
    const y = 300 - 28*Math.abs(Math.sin(x*0.013)) - 16;
    g.lineTo(x,y); g.lineTo(x+54,y);
  }
  g.lineTo(CFG.W,300); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.05)';
  for (let x=16;x<CFG.W;x+=28) for (let y=238;y<294;y+=16) g.fillRect(x,y,10,7);
}

// Rakip görseli, oyuncu sprite'ı mavi tonlanarak bir kez üretilir
let foeImg = null;
function getFoeImg(){
  if (foeImg) return foeImg;
  const im = IMG.idle;
  if (!im || !im.complete || !im.naturalWidth) return null;
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const x = c.getContext('2d');
  if (!x || !x.drawImage) return null;
  x.drawImage(im, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = 'rgba(26,72,196,.70)';
  x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'source-over';
  foeImg = c;
  return c;
}

function drawFoe(g, b){
  const d = b.plugin.def, w = d.w, h = d.h;
  const bx = b.position.x, byBottom = b.position.y + h/2;
  const im = getFoeImg();
  if (im){
    const PH = h*1.16, s = PH/286, DW = 120*s;
    const face = b.plugin.face || -level.dir;
    g.save();
    g.translate(bx, byBottom);
    g.scale(face >= 0 ? 1 : -1, 1);
    g.drawImage(im, -(64/120)*DW, -PH, DW, PH);
    g.restore();
  } else {
    g.save(); g.fillStyle='#1A48C4'; g.strokeStyle='#8FB4FF'; g.lineWidth=3;
    rr(g, bx-w/2, byBottom-h, w, h, 10); g.fill(); g.stroke(); g.restore();
  }
  // ayak izi: nereye kadar geldiğini göstersin
  g.save();
  g.strokeStyle='rgba(143,180,255,.30)'; g.lineWidth=2; g.setLineDash([6,8]);
  if (d.dx){
    g.beginPath();
    g.moveTo(b.plugin.home.x-d.dx, byBottom+4);
    g.lineTo(b.plugin.home.x+d.dx, byBottom+4);
    g.stroke();
  }
  g.setLineDash([]); g.restore();
}

const withBody = (g,b,fn)=>{ g.save(); g.translate(b.position.x,b.position.y); g.rotate(b.angle); fn(g); g.restore(); };

function drawBody(g,b,k){
  const d = b.plugin.def, w = d.w||0, h = d.h||0;
  if (k === 'foe'){ drawFoe(g,b); return; }
  if (k === 'bumper'){
    g.save(); g.translate(b.position.x,b.position.y);
    const pz = 1 + Math.sin(tick/240)*.05;
    g.fillStyle='#0F4A38'; g.beginPath(); g.arc(0,0,d.r,0,Math.PI*2); g.fill();
    g.strokeStyle='#3BE0A0'; g.lineWidth=7; g.beginPath(); g.arc(0,0,d.r*pz,0,Math.PI*2); g.stroke();
    g.strokeStyle='rgba(59,224,160,.28)'; g.lineWidth=2.5;
    g.beginPath(); g.arc(0,0,d.r*pz+12,0,Math.PI*2); g.stroke();
    g.strokeStyle='#3BE0A0'; g.lineWidth=5; g.lineCap='round';
    for(let i=0;i<3;i++){ const y=-15+i*15;
      g.beginPath(); g.moveTo(-16,y+6); g.lineTo(0,y-5); g.lineTo(16,y+6); g.stroke(); }
    g.restore(); return;
  }
  withBody(g,b,g=>{
    if (k === 'ice'){
      g.fillStyle='rgba(186,238,252,.30)'; g.strokeStyle='#BEEEFC'; g.lineWidth=3.5;
      rr(g,-w/2,-h/2,w,h,8); g.fill(); g.stroke();
      g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=2.5;
      for(let x=-w/2+22;x<w/2-12;x+=52){ g.beginPath(); g.moveTo(x,-h/2+5); g.lineTo(x+15,h/2-5); g.stroke(); }
    } else if (k === 'mud'){
      g.fillStyle='#4A3417'; g.strokeStyle='#6D5024'; g.lineWidth=3.5;
      rr(g,-w/2,-h/2,w,h,10); g.fill(); g.stroke();
      g.fillStyle='rgba(0,0,0,.34)';
      for(let x=-w/2+16;x<w/2-10;x+=24){
        g.beginPath(); g.ellipse(x,-h/2+13+(x%3)*4,8,4,0,0,Math.PI*2); g.fill(); }
    } else if (k === 'glass'){
      g.fillStyle='rgba(186,238,252,.18)'; g.strokeStyle='rgba(200,244,255,.9)'; g.lineWidth=3.5;
      rr(g,-w/2,-h/2,w,h,5); g.fill(); g.stroke();
      g.strokeStyle='rgba(255,255,255,.4)'; g.lineWidth=2;
      if (h > w) for(let y=-h/2+30;y<h/2-12;y+=48){ g.beginPath(); g.moveTo(-w/2,y); g.lineTo(w/2,y-12); g.stroke(); }
      else for(let x=-w/2+30;x<w/2-12;x+=48){ g.beginPath(); g.moveTo(x,-h/2); g.lineTo(x-12,h/2); g.stroke(); }
    } else if (k === 'crate'){
      g.fillStyle='#7A4E24'; g.strokeStyle='#C08A4A'; g.lineWidth=5;
      rr(g,-w/2,-h/2,w,h,7); g.fill(); g.stroke(); g.lineWidth=3.5;
      g.beginPath(); g.moveTo(-w/2+5,-h/2+5); g.lineTo(w/2-5,h/2-5);
      g.moveTo(w/2-5,-h/2+5); g.lineTo(-w/2+5,h/2-5); g.stroke();
    } else if (k === 'mover'){
      g.fillStyle='#3A2320'; g.strokeStyle='#FF9257'; g.lineWidth=5;
      rr(g,-w/2,-h/2,w,h,8); g.fill(); g.stroke();
      g.fillStyle='rgba(255,146,87,.5)';
      for(let y=-h/2+12;y<h/2-10;y+=26) g.fillRect(-w/2+6,y,w-12,10);
    } else if (k === 'pillar'){
      // taş sütun: harç çizgileriyle örülü bloklar
      g.fillStyle='#8E887A'; g.strokeStyle='#5C574C'; g.lineWidth=3;
      rr(g,-w/2,-h/2,w,h,8); g.fill(); g.stroke();
      g.strokeStyle='rgba(70,66,58,.55)'; g.lineWidth=2;
      const bh = 46, half = w/2 - 4;
      for (let y=-h/2+bh; y<h/2-4; y+=bh){
        g.beginPath(); g.moveTo(-half,y); g.lineTo(half,y); g.stroke();
      }
      let row = 0;
      for (let y=-h/2; y<h/2-bh*0.5; y+=bh, row++){
        const mx = row%2 ? -w/6 : w/6;
        g.beginPath(); g.moveTo(mx, Math.max(-h/2+2,y)); g.lineTo(mx, Math.min(h/2-2,y+bh)); g.stroke();
      }
      g.fillStyle='rgba(255,255,255,.13)'; rr(g,-w/2+5,-h/2+5,w*0.22,h-10,5); g.fill();
    } else {
      const grass = h >= 50;
      g.fillStyle = grass ? '#5A3A20' : '#6B4626';
      g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2.5;
      rr(g,-w/2,-h/2,w,h, grass?9:7); g.fill(); g.stroke();
      g.fillStyle='#2F9C5A'; rr(g,-w/2,-h/2,w, grass?22:Math.min(11,h/2), 8); g.fill();
      if (grass){
        g.fillStyle='#3FBF6E'; g.fillRect(-w/2+4,-h/2+3,w-8,6);
        g.fillStyle='rgba(0,0,0,.15)';
        for(let x=-w/2+14;x<w/2-8;x+=34) g.fillRect(x,-h/2+28,5,11);
      }
    }
  });
}

function drawSpike(g,s){
  const n = Math.max(3, Math.round(s.w/30)), sw = s.w/n;
  g.save(); g.translate(s.x,s.y);
  g.fillStyle='#4A1414'; g.strokeStyle='rgba(0,0,0,.4)'; g.lineWidth=2.5;
  rr(g,-s.w/2,-s.h/2+11,s.w,s.h-11,6); g.fill(); g.stroke();
  const grad = g.createLinearGradient(0,-s.h/2-18,0,-s.h/2+12);
  grad.addColorStop(0,'#FF7A6A'); grad.addColorStop(1,'#C4322A');
  g.fillStyle = grad; g.beginPath();
  for(let i=0;i<n;i++){ const x=-s.w/2+i*sw;
    g.moveTo(x,-s.h/2+12); g.lineTo(x+sw/2,-s.h/2-19); g.lineTo(x+sw,-s.h/2+12); }
  g.fill(); g.restore();
}

function drawFan(g,s){
  g.save(); g.translate(s.x,s.y);
  g.fillStyle='rgba(120,196,255,.09)'; g.strokeStyle='rgba(120,196,255,.30)';
  g.lineWidth=2.5; g.setLineDash([12,12]);
  rr(g,-s.w/2,-s.h/2,s.w,s.h,16); g.fill(); g.stroke(); g.setLineDash([]);
  const ang = Math.atan2(s.fy||0, s.fx||0), drift = (tick/14)%74;
  g.strokeStyle='rgba(160,214,255,.45)'; g.lineWidth=3.5; g.lineCap='round';
  for(let i=-2;i<=2;i++){
    const off = i*Math.min(s.w,s.h)/6;
    for(let k=-1;k<=1;k++){
      const t = drift + k*74 - 37;
      g.save();
      g.translate(Math.cos(ang)*t - Math.sin(ang)*off, Math.sin(ang)*t + Math.cos(ang)*off);
      g.rotate(ang);
      g.beginPath(); g.moveTo(-18,0); g.lineTo(16,0);
      g.moveTo(6,-8); g.lineTo(16,0); g.lineTo(6,8); g.stroke();
      g.restore();
    }
  }
  g.restore();
}

function drawPortal(g,s){
  g.save();
  g.setLineDash([8,15]); g.strokeStyle='rgba(199,123,255,.20)'; g.lineWidth=2.5;
  g.beginPath(); g.moveTo(s.x,s.y); g.lineTo(s.tx,s.ty); g.stroke(); g.setLineDash([]);
  for (const pr of [[s.x,s.y,'#C77BFF'],[s.tx,s.ty,'#7BE7FF']]){
    const r = s.r + Math.sin(tick/230)*4;
    g.strokeStyle=pr[2]; g.lineWidth=6;
    g.beginPath(); g.ellipse(pr[0],pr[1],r*.6,r,0,0,Math.PI*2); g.stroke();
    g.strokeStyle=pr[2]+'55'; g.lineWidth=2.5;
    g.beginPath(); g.ellipse(pr[0],pr[1],r*.36,r*.66,0,0,Math.PI*2); g.stroke();
  }
  g.restore();
}

// Alev çemberi: üst ve alt yaylar yakar, ortadaki açıklık geçittir
function drawRing(g,s){
  const done = s.passed;
  const a = Math.asin(Math.max(-1, Math.min(1, s.gap/s.r)));
  g.save(); g.translate(s.x, s.y); g.lineCap='round';
  const arcs = (rad, lw, col)=>{
    g.strokeStyle = col; g.lineWidth = lw;
    g.beginPath(); g.arc(0,0,rad, -Math.PI+a, -a); g.stroke();
    g.beginPath(); g.arc(0,0,rad, a, Math.PI-a); g.stroke();
  };
  // titreşen dış alev
  for (let i=0;i<3;i++){
    const fl = Math.sin(tick/(130+i*40) + i*2)*4;
    arcs(s.r + 9 + i*6 + fl, 13 - i*3,
      done ? 'rgba(59,224,160,'+(0.22-i*0.06)+')' : 'rgba(255,110,20,'+(0.26-i*0.07)+')');
  }
  arcs(s.r, 14, done ? '#2FB98A' : '#E8541A');
  arcs(s.r, 7,  done ? '#8CF3D0' : '#FFB020');
  arcs(s.r, 2.5, done ? '#EFFFF9' : '#FFF0B8');
  // geçit hattı
  g.setLineDash([9,11]); g.lineWidth = 2;
  g.strokeStyle = done ? 'rgba(140,243,208,.30)' : 'rgba(255,211,78,.32)';
  g.beginPath();
  g.moveTo(-s.r*0.95, -s.gap); g.lineTo(s.r*0.95, -s.gap);
  g.moveTo(-s.r*0.95,  s.gap); g.lineTo(s.r*0.95,  s.gap);
  g.stroke(); g.setLineDash([]);
  g.restore();
}

function drawStar(g,s){
  g.save(); g.translate(s.x, s.y + Math.sin(tick/560)*6); g.rotate(Math.sin(tick/900)*.28);
  g.shadowColor='rgba(255,197,61,.7)'; g.shadowBlur=20;
  g.fillStyle='#FFC53D'; g.strokeStyle='#8A6110'; g.lineWidth=2.5;
  g.beginPath();
  for(let i=0;i<10;i++){
    const r = i%2 ? 11 : 25, a = -Math.PI/2 + i*Math.PI/5;
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    i ? g.lineTo(px,py) : g.moveTo(px,py);
  }
  g.closePath(); g.fill(); g.shadowBlur=0; g.stroke(); g.restore();
}

function drawGoal(g, gl){
  const im = gl.side==='R' ? IMG.goalR : IMG.goalL;
  if (!im || !im.complete) return;
  const x = gl.side==='R' ? gl.x - GOAL_W*0.03 : gl.x - GOAL_W*0.97;
  g.save();
  g.shadowColor='rgba(0,0,0,.45)'; g.shadowBlur=18; g.shadowOffsetY=8;
  g.drawImage(im, x, gl.y - GOAL_H, GOAL_W, GOAL_H);
  g.restore();
}

function drawStroke(g,pts,alpha){
  if (pts.length<2) return;
  g.save(); g.lineCap='round'; g.lineJoin='round'; g.globalAlpha=alpha;
  g.shadowColor='rgba(255,197,61,.55)'; g.shadowBlur=18;
  g.strokeStyle='#FFC53D'; g.lineWidth=CFG.STROKE_T;
  path(g,pts,0); g.stroke(); g.shadowBlur=0;
  g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=3.5;
  path(g,pts,-3.5); g.stroke();
  g.restore();
}
function path(g,pts,dy){
  g.beginPath(); g.moveTo(pts[0].x, pts[0].y+dy);
  for(let i=1;i<pts.length;i++) g.lineTo(pts[i].x, pts[i].y+dy);
}

function drawTrail(g){
  if (trail.length<2) return;
  g.save(); g.lineCap='round'; g.lineJoin='round';
  for(let i=1;i<trail.length;i++){
    g.strokeStyle='rgba(255,255,255,'+(i/trail.length*0.30)+')';
    g.lineWidth = 2 + i/trail.length*8;
    g.beginPath(); g.moveTo(trail[i-1].x,trail[i-1].y); g.lineTo(trail[i].x,trail[i].y); g.stroke();
  }
  g.restore();
}

function drawPlayer(g){
  let key, anchor, w;
  if (phase === 'windup' || (phase!=='aim' && kickT < 620)){ key='kick'; anchor=76/211; w=211; }
  else { const alt = Math.floor(tick/720)%2;
    key = alt ? 'idle2' : 'idle'; anchor = alt ? 29/100 : 64/120; w = alt ? 100 : 120; }
  const im = IMG[key];
  if (!im || !im.complete) return;
  const PH = 250, s = PH/286, DW = w*s;
  const px = level.player.x, py = level.player.y;
  g.save();
  g.translate(px, py); g.scale(level.dir, 1);
  g.drawImage(im, -anchor*DW, -PH, DW, PH);
  g.restore();
}

function drawBall(g){
  const im = IMG[skin];
  g.save(); g.translate(ball.position.x, ball.position.y);
  g.globalAlpha=.28; g.fillStyle='#000';
  g.beginPath(); g.ellipse(3,6,CFG.BALL_R*1.05,CFG.BALL_R*.9,0,0,Math.PI*2); g.fill();
  g.globalAlpha=1; g.rotate(ball.angle);
  const D = CFG.BALL_R*2.16;
  if (im && im.complete) g.drawImage(im, -D/2, -D/2, D, D);
  else { g.fillStyle='#fff'; g.beginPath(); g.arc(0,0,CFG.BALL_R,0,Math.PI*2); g.fill(); }
  g.restore();
}

function drawSparks(g){
  for (const s of sparks){
    g.globalAlpha = Math.max(0,s.life); g.fillStyle = s.c;
    g.beginPath(); g.arc(s.x,s.y,4*s.life+1.5,0,Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
}

// Güç göstergesi: oyuncunun üstünde, önerilen güç çentikli
function drawPower(g){
  const W = 300, H = 26;
  const x = Math.max(20, Math.min(CFG.W-W-20, level.player.x - W/2));
  const y = Math.max(16, level.player.y - 306);
  const f = chargeFrac(), mult = powerMult();
  g.save();
  g.fillStyle='rgba(8,19,31,.82)'; rr(g,x-4,y-4,W+8,H+8,10); g.fill();
  g.strokeStyle='rgba(29,63,92,1)'; g.lineWidth=2; rr(g,x,y,W,H,7); g.stroke();
  const grad = g.createLinearGradient(x,0,x+W,0);
  grad.addColorStop(0,'#4CE0B3'); grad.addColorStop(.55,'#FFC53D'); grad.addColorStop(1,'#FF6B5E');
  g.fillStyle = grad;
  rr(g, x+2, y+2, Math.max(4,(W-4)*f), H-4, 5); g.fill();
  // önerilen güç çentiği
  const rx = x + (W-4)*refFrac() + 2;
  g.strokeStyle='#EAF3FA'; g.lineWidth=3;
  g.beginPath(); g.moveTo(rx, y-6); g.lineTo(rx, y+H+6); g.stroke();
  g.font='bold 15px "Trebuchet MS", sans-serif'; g.textAlign='center'; g.textBaseline='bottom';
  g.fillStyle='rgba(234,243,250,.75)';
  g.fillText('önerilen', rx, y-9);
  // yüzde: sığdığı tarafa yaz, iki taraf da dar kalırsa barın üstüne ortala
  g.font='bold 19px "Trebuchet MS", sans-serif';
  g.fillStyle='#EAF3FA'; g.textBaseline='middle';
  const label = '%'+Math.round(mult*100);
  const tw = g.measureText(label).width;
  if (x + W + 14 + tw <= CFG.W - 10){
    g.textAlign='left';  g.fillText(label, x + W + 14, y + H/2);
  } else if (x - 14 - tw >= 10){
    g.textAlign='right'; g.fillText(label, x - 14, y + H/2);
  } else {
    g.textAlign='center'; g.textBaseline='bottom';
    g.fillText(label, x + W/2, y - 30);
  }
  g.restore();
}

function drawBanner(g){
  const t = banner.t/banner.ms, pop = Math.min(1, banner.t/180);
  const MAXW = CFG.W - 240;          // ekrana sığdır: uzun yazı küçültülür
  g.save();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 92;
  g.font = 'bold ' + size + 'px "Trebuchet MS", sans-serif';
  const w = g.measureText(banner.text).width || 0;
  if (w > MAXW) size = Math.max(30, Math.floor(size * MAXW / w));
  g.font = 'bold ' + size + 'px "Trebuchet MS", sans-serif';
  g.globalAlpha = t > 0.78 ? Math.max(0, (1-t)/0.22) : 1;
  g.translate(CFG.W/2, 190);
  const s = 0.72 + pop*0.28;
  g.scale(s, s);
  g.lineWidth = Math.max(6, size*0.14);
  g.strokeStyle = 'rgba(6,15,26,.88)';
  g.strokeText(banner.text, 0, 0);
  g.fillStyle = banner.color;
  g.fillText(banner.text, 0, 0);
  g.restore();
}

function rr(g,x,y,w,h,r){
  r = Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

/* ---------- arayüz ---------- */
const $ = id => document.getElementById(id);

function syncHud(){
  $('lvlNum').textContent = (levelIdx+1)+'/'+LEVELS.length;
  $('lvlName').textContent = level.n;
  const live = inkLeft - (drawing ? drawing.used : 0);
  const pct = Math.max(0, live/level.ink);
  $('inkFill').style.width = (pct*100).toFixed(1)+'%';
  $('inkFill').classList.toggle('low', pct < .2);
  $('stars').innerHTML = starRow(starCount(), (level.stars||[]).length);
  const rl = sensors.filter(s=>s.t==='ring').length;
  $('rings').innerHTML = rl ? ('&nbsp;&nbsp;<b>'+(rl-ringsLeft())+'/'+rl+'</b> çember') : '';
  $('tKick').disabled = phase !== 'aim';
  syncClock();
}
function syncClock(){
  const c = $('clock');
  if (!level.time){ c.style.display='none'; return; }
  c.style.display='';
  c.textContent = Math.max(0,timeLeft).toFixed(1);
  c.classList.toggle('warn', timeLeft < 5);
}
const VEILS = ['vMenu','vLevels','vBalls','vBrief','vWin','vLose'];
function show(id){ VEILS.forEach(v=>$(v).classList.toggle('hide', v!==id)); $('hud').classList.add('dim'); }
function hideAll(){ VEILS.forEach(v=>$(v).classList.add('hide')); $('hud').classList.remove('dim'); }

function buildGrid(){
  const gr = $('grid'); gr.innerHTML=''; let ch = -1;
  LEVELS.forEach((L,i)=>{
    if (L.ch !== ch){
      ch = L.ch;
      const h = document.createElement('div');
      h.className='chapter'; h.textContent = CHAPTERS[ch];
      gr.appendChild(h);
    }
    const open = DEV_UNLOCK || i===0 || progress[i-1].done;
    const b = document.createElement('button');
    b.className='cell'+(progress[i].done?' done':'')+(open?'':' locked');
    b.innerHTML = (open?(i+1):'🔒')+'<span class="s">'+(open?starRow(progress[i].stars,(L.stars||[]).length):'')+'</span>';
    if (open) b.onclick = ()=>openLevel(i);
    gr.appendChild(b);
  });
}

function buildBalls(){
  const gr = $('ballGrid'); gr.innerHTML='';
  BALL_SKINS.forEach(k=>{
    const b = document.createElement('button');
    b.className='cell ball'+(skin===k?' done':'');
    b.innerHTML='<img src="'+ASSETS[k]+'" alt="">';
    b.onclick=()=>{ skin=k; buildBalls(); };
    gr.appendChild(b);
  });
}

function openLevel(i){
  buildLevel(i);
  $('briefTitle').textContent = (i+1)+'. '+LEVELS[i].n;
  $('briefHint').textContent = LEVELS[i].hint;
  show('vBrief');
}

$('btnPlay').onclick   = ()=>{ const i=progress.findIndex(p=>!p.done); openLevel(i<0?0:i); };
$('btnLevels').onclick = ()=>{ buildGrid(); show('vLevels'); };
$('btnBalls').onclick  = ()=>{ buildBalls(); show('vBalls'); };
$('btnBack').onclick   = ()=>show('vMenu');
$('btnBack2').onclick  = ()=>show('vMenu');
$('btnStart').onclick  = ()=>{ hideAll(); syncHud(); };
$('btnNext').onclick   = ()=>openLevel(Math.min(levelIdx+1,LEVELS.length-1));
$('btnReplay').onclick = ()=>openLevel(levelIdx);
$('btnMenu2').onclick  = ()=>{ buildGrid(); show('vLevels'); };
$('btnMenu3').onclick  = ()=>{ buildGrid(); show('vLevels'); };
$('btnRetry').onclick  = ()=> openLevel(levelIdx);
$('btnPause').onclick  = ()=>{ buildGrid(); show('vLevels'); };
const KB = $('tKick');
KB.addEventListener('pointerdown', ev=>{
  ev.preventDefault();
  if (phase !== 'aim') return;
  KB.setPointerCapture(ev.pointerId);
  charging = true; chargeT = 0; KB.classList.add('charging');
});
function endCharge(ev){
  if (!charging) return;
  if (ev) ev.preventDefault();
  charging = false; KB.classList.remove('charging');
  kickPower = level.kick.p * powerMult();
  phase = 'windup'; kickT = 0;
  syncHud();
}
KB.addEventListener('pointerup', endCharge);
KB.addEventListener('pointercancel', endCharge);

/* ---------- döngü ---------- */
const SPEED = 1.60;   // oyunun genel akış hızı. Fizik adımları aynı, sadece
                      // gerçek zamanda daha hızlı oynatılır: yörüngeler değişmez.
let lastT = performance.now(), acc = 0;
function loop(now){
  acc += Math.max(0, Math.min(now-lastT, 64)) * slowmo * SPEED;
  lastT = now;
  let guard = 0;
  while (acc >= CFG.DT && guard++ < 5){ step(CFG.DT); acc -= CFG.DT; }
  drawFrame();
  requestAnimationFrame(loop);
}

loadImages();
buildLevel(0);
resize();
show('vMenu');
requestAnimationFrame(loop);
</script>
